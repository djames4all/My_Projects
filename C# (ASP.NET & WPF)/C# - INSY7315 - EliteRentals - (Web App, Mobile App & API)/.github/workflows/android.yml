name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Auto-detect the real Gradle ROOT (contains gradlew + settings.gradle*)
      - name: Find Gradle project root
        id: find-root
        run: |
          ROOT=$(find . -name "settings.gradle*" -printf "%h\n" | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "No Gradle settings.gradle found!"
            exit 1
          fi
          echo "Gradle root: $ROOT"
          echo "root=$ROOT" >> $GITHUB_OUTPUT

      # Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ${{ steps.find-root.outputs.root }}/gradlew

      # Fix Windows CRLF line endings
      - name: Fix gradlew line endings
        run: sed -i 's/\r$//' ${{ steps.find-root.outputs.root }}/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Build
      - name: Build Debug APK
        working-directory: ${{ steps.find-root.outputs.root }}
        run: ./gradlew assembleDebug

      # Tests
      - name: Run Unit Tests
        working-directory: ${{ steps.find-root.outputs.root }}
        run: ./gradlew testDebugUnitTest

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/outputs/apk/debug/*.apk"
